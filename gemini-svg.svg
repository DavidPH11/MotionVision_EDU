<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </radialGradient>
  </defs>
  <!-- Fondo circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="#020c1b" stroke="#00f2fe" stroke-width="2"/>
  
  <!-- Órbitas -->
  <ellipse cx="50" cy="50" rx="35" ry="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" transform="rotate(-30 50 50)"/>
  <ellipse cx="50" cy="50" rx="35" ry="14" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.8" transform="rotate(30 50 50)"/>
  
  <!-- Núcleo brillante -->
  <circle cx="50" cy="50" r="12" fill="url(#spaceGlow)"/>
  <circle cx="50" cy="50" r="6" fill="#ffffff"/>
  
  <!-- Estrellas / Partículas -->
  <circle cx="78" cy="35" r="3" fill="#ffffff"/>
  <circle cx="22" cy="65" r="2" fill="#00f2fe"/>
</svg>
