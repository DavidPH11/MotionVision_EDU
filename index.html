<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Vision EDU</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background-color: #000000;
    }

    /* Fondo de espacio azul y contenedor principal */
    .landing-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0a192f 0%, #020c1b 60%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Canvas para estrellas animadas */
    #starfieldCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Contenido centrado sobre el fondo */
    .landing-content {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Título principal centrado */
    .main-title {
      font-size: 3.8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 0 50px rgba(10, 25, 47, 0.8);
      margin-bottom: 2.5rem;
      letter-spacing: -1px;
    }

    /* Botón blanco idéntico al diseño de referencia */
    .btn-start {
      background-color: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 1.15rem;
      padding: 14px 40px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-start:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
    }

    .btn-start:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>

  <div id="landingScreen" class="landing-screen">
    <canvas id="starfieldCanvas"></canvas>
    <div class="landing-content">
      <h1 class="main-title">Motion Vision EDU</h1>
      <button id="btnStart" class="btn-start">Start &rarr;</button>
    </div>
  </div>

  <script>
    // Configuración del canvas y fondo de estrellas
    const canvas = document.getElementById('starfieldCanvas');
    const ctx = canvas.getContext('2d');

    let stars = [];
    const numStars = 200;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.4 + 0.1,
          opacity: Math.random() * 0.8 + 0.2
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
        ctx.fill();

        star.y -= star.speed;
        if (star.y < 0) {
          star.y = canvas.height;
          star.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    resizeCanvas();
    initStars();
    animateStars();
  </script>

</body>
</html>
